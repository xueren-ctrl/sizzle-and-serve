<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sizzle &amp; Serve — a one-chef cooking rush</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body {
    margin: 0;
    background: #2b1d12;
    color: #f7ead0;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    text-align: center;
  }
  main { max-width: 980px; margin: 0 auto; padding: 16px 10px 28px; }
  h1 { margin: 4px 0 2px; font-size: 30px; letter-spacing: 1px; }
  .tag { margin: 0 0 12px; color: #d9b98a; font-size: 15px; }
  canvas {
    width: 100%;
    max-width: 960px;
    height: auto;
    display: block;
    margin: 0 auto;
    border: 4px solid #8b5a2b;
    border-radius: 10px;
    background: #f2e3c6;
    cursor: pointer;
  }
  .help { margin: 12px 0 0; color: #d9b98a; font-size: 14px; }
</style>
</head>
<body>
<main>
  <h1>SIZZLE &amp; SERVE</h1>
  <p class="tag">One chef. One rush hour. Feed the lunch crowd.</p>
  <canvas id="game" width="960" height="600"></canvas>
  <p class="help">Move: WASD / arrows, or click the floor to walk there &nbsp;·&nbsp; Use a station: E / Space, or click the station &nbsp;·&nbsp; P pause &nbsp;·&nbsp; M mute</p>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
